name: Build APK
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && node tools/sync-version.mjs && npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 'labass-apk-v${{ steps.v.outputs.version }}', path: android/app/build/outputs/apk/debug/*.apk }
      # Release : lien de téléchargement direct (ouvrable depuis le téléphone)
      - name: Publier la release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          APK=$(ls android/app/build/outputs/apk/debug/*.apk)
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" "$APK" --clobber \
            || gh release create "$TAG" "$APK" --target "${{ github.sha }}" --title "Labass $TAG" --notes "APK debug Labass $TAG"
